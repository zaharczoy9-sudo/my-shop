<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 15px;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  h2 { margin-bottom: 15px; text-align: center; }
  .card {
    border: 1px solid var(--tg-theme-hint-color, #eee);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 15px;
    background: var(--tg-theme-secondary-bg-color, #f9f9f9);
  }
  .card img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .card h3 { margin-bottom: 5px; font-size: 18px; }
  .card p { color: var(--tg-theme-hint-color, #888); font-size: 14px; margin-bottom: 8px; }
  .price { font-weight: bold; color: var(--tg-theme-link-color, #2aabee); font-size: 20px; margin-bottom: 10px; }
  .stock { font-size: 13px; color: var(--tg-theme-hint-color, #888); margin-bottom: 10px; }
  button {
    width: 100%;
    padding: 12px;
    background: var(--tg-theme-button-color, #2aabee);
    color: var(--tg-theme-button-text-color, #fff);
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
  .empty { text-align: center; color: var(--tg-theme-hint-color, #888); margin-top: 40px; font-size: 16px; }
</style>
</head>
<body>
<h2>🛍 Каталог</h2>
<div id="list"><p class="empty">Загрузка...</p></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

fetch("/api/products")
  .then(r => r.json())
  .then(products => {
    const list = document.getElementById("list");
    if (products.length === 0) {
      list.innerHTML = '<p class="empty">Каталог пока пуст 😔</p>';
      return;
    }
    list.innerHTML = products.map(p => `
      <div class="card">
        ${p.photo_url ? `<img src="${p.photo_url}" alt="${p.name}">` : ""}
        <h3>${p.name}</h3>
        ${p.description ? `<p>${p.description}</p>` : ""}
        <div class="price">${p.price} ₽</div>
        <div class="stock">В наличии: ${p.stock} шт.</div>
        ${p.stock > 0
          ? `<button onclick="buy(${p.id})">Купить</button>`
          : `<button disabled style="opacity:0.5">Нет в наличии</button>`
        }
      </div>
    `).join("");
  })
  .catch(() => {
    document.getElementById("list").innerHTML = '<p class="empty">Ошибка загрузки</p>';
  });

function buy(id) {
  tg.sendData(String(id));
}
</script>
</body>
</html>
